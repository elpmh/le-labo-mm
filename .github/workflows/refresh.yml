name: Refresh catalogue & deploy
# Free auto-refresh: re-pulls the public feed daily and redeploys the static site.
on:
  schedule:
    - cron: "0 6 * * *"      # every day at 06:00 UTC
  workflow_dispatch:          # and on demand
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Refresh datasets from public feed
        run: bash scripts/refresh.sh
      - name: Commit refreshed data (if changed)
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add site/data/*.json
          git commit -m "chore: refresh catalogue data" || echo "no changes"
          git push || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
